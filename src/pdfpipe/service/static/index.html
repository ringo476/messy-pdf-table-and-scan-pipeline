<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messy PDF Pipeline</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6a6a64; --line: #dedcd6;
  --accent: #1f5f8b; --ok: #1d7a4c; --warn: #a15c00; --bad: #b3261e; --warn-bg: #fdf3e2; --bad-bg: #fbeae8; --ok-bg: #e7f4ed;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171716; --panel: #212120; --text: #ecebe6; --muted: #a3a29b; --line: #393936;
    --accent: #7ab7e0; --ok: #6ccb9a; --warn: #e6ae5e; --bad: #f0928b; --warn-bg: #33291a; --bad-bg: #362120; --ok-bg: #1b2e24;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
header strong { font-size: 16px; }
main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 60px; }
h2 { font-size: 17px; margin: 28px 0 10px; }
h2:first-child { margin-top: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spread { justify-content: space-between; }
button, input { font: inherit; color: inherit; }
input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%; }
button, a.button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; color: var(--text); text-decoration: none; }
button:hover, a.button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
button:disabled { opacity: .55; cursor: default; }
label { display: block; margin: 0 0 12px; }
label span { display: block; margin-bottom: 4px; font-size: 13px; color: var(--muted); }
.login { max-width: 360px; margin: 60px auto; }
.error { color: var(--bad); margin: 8px 0 0; min-height: 1.5em; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; font-weight: 600; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
tr.link { cursor: pointer; }
tr.link:hover td { background: var(--bg); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; white-space: nowrap; background: var(--bg); color: var(--muted); }
.tag.accepted, .tag.reviewed { background: var(--ok-bg); color: var(--ok); }
.tag.needs_review { background: var(--warn-bg); color: var(--warn); }
.tag.failed { background: var(--bad-bg); color: var(--bad); }
.field-review td { background: var(--warn-bg); }
.reason { color: var(--warn); font-size: 13px; margin-top: 4px; }
.suggest { font-size: 13px; margin-top: 4px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.chart { max-width: 100%; max-height: 280px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
.region-text { white-space: pre-wrap; margin: 6px 0 14px; }
.kind { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.drop { border: 1px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; }
.drop.over { border-color: var(--accent); background: var(--bg); }
@media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } .hide-narrow { display: none; } }
</style>
</head>
<body>
<header>
  <strong>Messy PDF Pipeline</strong>
  <div class="row" id="user-area"></div>
</header>
<main id="main"></main>
<script src="/app.js"></script>
</body>
</html>
