[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfpipe"
version = "0.1.0"
description = "Turns messy PDFs into checked JSON, and sends anything uncertain to a person."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "opencv-python-headless>=5,<6",
    "onnxruntime>=1.31,<2",
    "pdfplumber>=0.11,<0.12",
    "pillow>=11",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pypdfium2>=5,<6",
    "rapid-layout>=1.2,<2",
    "rapid-table>=3,<4",
    "rapidocr>=3.10,<4",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32,<1",
]
llm = ["openai>=1,<3", "anthropic>=0.75,<1"]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8",
    "reportlab>=4.2",
    "ruff>=0.8",
]

[project.scripts]
pdfpipe = "pdfpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdfpipe = ["service/static/*", "service/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: runs the real OCR, layout and table models (slower)",
    "postgres: needs a Postgres server (set PDFPIPE_TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]
